<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Region Arena</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#18202a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* v1.1 layout: a city-planning office. Dark masthead with rank + XP; the course is a metro network (5 lines);
   the city map (TP.HCM mới, 6 game zones) is the hub of the governance round; the case study is a readable dossier.
   One column on phones, two columns from 900 px. Zone colours are tokens shared by map, chips and dashboards. */
:root{
  --paper:#f2f3ef; --card:#ffffff; --ink:#18202a; --muted:#5d6672; --rule:#d9ddd8; --soft:#e9ece6; --mast:#18202a; --mastink:#eef1ec;
  --c1:#0f7b74; --c2:#4a4fb3; --c3:#c27a00; --c4:#b8334a; --c5:#2f7d32;
  --v1:#c8463d; --v2:#7a55b3; --v3:#b0662a; --v4:#0f7b74; --v5:#6c8a2a; --v6:#2a86b0; --v7:#3a8a3f; --v8:#2f4f9e; --v9:#cc8a10; --v10:#b8336f; --zot:#cdd2cb;
  --sea:#dbe8f0; --land:#eceee7; --river:#6f9dc3; --edge:#ffffff; --zcink:#ffffff;
  --good:#1d7a46; --warn:#b26a00; --bad:#b3261e;
  --display:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161b; --card:#1a2027; --ink:#e7eae6; --muted:#9aa3ad; --rule:#2c343d; --soft:#222a32; --mast:#0c1014; --mastink:#e7eae6;
  --c1:#3fb8ad; --c2:#8d92f0; --c3:#f0a93a; --c4:#ec6a80; --c5:#6cc070;
  --v1:#ec7a70; --v2:#a98ae0; --v3:#e09a5c; --v4:#3fb8ad; --v5:#a9c45a; --v6:#5cb8e0; --v7:#6cc070; --v8:#7f9ff0; --v9:#f0b445; --v10:#ec7aa8; --zot:#3a434c;
  --sea:#14212b; --land:#222a31; --river:#3f6f96; --edge:#12161b; --zcink:#12161b;
  --good:#5cc489; --warn:#f0a93a; --bad:#ff7a70; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161b; --card:#1a2027; --ink:#e7eae6; --muted:#9aa3ad; --rule:#2c343d; --soft:#222a32; --mast:#0c1014; --mastink:#e7eae6;
  --c1:#3fb8ad; --c2:#8d92f0; --c3:#f0a93a; --c4:#ec6a80; --c5:#6cc070;
  --v1:#ec7a70; --v2:#a98ae0; --v3:#e09a5c; --v4:#3fb8ad; --v5:#a9c45a; --v6:#5cb8e0; --v7:#6cc070; --v8:#7f9ff0; --v9:#f0b445; --v10:#ec7aa8; --zot:#3a434c;
  --sea:#14212b; --land:#222a31; --river:#3f6f96; --edge:#12161b; --zcink:#12161b;
  --good:#5cc489; --warn:#f0a93a; --bad:#ff7a70; color-scheme:dark}
*{box-sizing:border-box}
html{padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}

/* masthead */
header{position:sticky;top:0;z-index:5;background:var(--mast);color:var(--mastink);padding-top:env(safe-area-inset-top,0px)}
header .in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo b{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.zen{font-size:10.5px;opacity:.7;letter-spacing:.08em;text-transform:uppercase}
.me{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;min-width:0}
.me .who{font-weight:700}
.me .u{font-family:var(--mono);opacity:.7}
.xp{display:flex;flex-direction:column;gap:3px;min-width:150px}
.xp .t{display:flex;justify-content:space-between;gap:8px;font-size:11.5px}
.xp .t b{font-family:var(--mono)}
.xpbar{height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--c3),#f6c35b)}
.zchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px 2px 4px;font-size:12px;font-weight:600;background:rgba(255,255,255,.1)}
.zchip i{display:inline-grid;place-items:center;min-width:22px;height:18px;border-radius:9px;background:var(--zc);color:#fff;font:800 10.5px var(--mono);font-style:normal;padding:0 4px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-6px}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:inherit;opacity:.72;font:600 13.5px var(--body);padding:9px 12px 11px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
nav button[aria-current="true"]{opacity:1;border-bottom-color:var(--c3)}
nav button:hover{opacity:1}
nav button[data-tab="out"]{margin-left:auto}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--c2);outline-offset:2px}

/* type + basics */
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
h2{font-size:18px;font-weight:700;line-height:1.3}
h3{font-size:15px;font-weight:700}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c3)}
.pagehead{display:flex;flex-direction:column;gap:6px;max-width:68ch}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.accent{border-top:4px solid var(--zc,var(--c3))}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:900px){.grid2{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.grid2 .sticky{position:sticky;top:120px}}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--card);font:600 14px var(--body);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--soft)}
.chip.good{color:var(--good);border-color:currentColor;background:none}
.chip.warn{color:var(--warn);border-color:currentColor;background:none}
.chip.bad{color:var(--bad);border-color:currentColor;background:none}
.field-bad{outline:2px solid var(--bad);outline-offset:1px}
.fgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.7fr);gap:8px;align-items:center}
.fgrid select,.fgrid input{width:100%}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.dsec{display:flex;flex-wrap:wrap;gap:6px}
.zc{display:inline-grid;place-items:center;min-width:28px;height:22px;border-radius:11px;background:var(--zc);color:var(--zcink);font:800 11.5px var(--mono);padding:0 6px;flex:none}
input[type=text],input[type=password],input[type=number],select,textarea{font:15px var(--body);padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);min-width:0;max-width:100%}
select{width:100%}
textarea{font-family:var(--mono);font-size:13px;width:100%;min-height:9em}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--rule);padding-left:9px}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:800 28px var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

/* login */
.login{max-width:440px;margin:6vh auto 0;overflow:hidden;padding:0}
.login .hero{background:var(--mast);color:var(--mastink);padding:18px 18px 14px;display:flex;flex-direction:column;gap:6px}
.login .hero svg{width:100%;height:auto;max-height:190px}
.login form{padding:16px;display:flex;flex-direction:column;gap:8px}

/* route: metro network */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lines{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:900px){.lines{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.line{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--lc);min-width:0}
.line.closed{border-top-style:dashed}
.lhead{display:flex;align-items:center;gap:10px}
.lbadge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--lc);color:#fff;font:800 14px var(--display);flex:none}
.lprog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.lprog .bar{flex:1}
.stations{list-style:none;margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:6px;position:relative}
.stations::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:5px;border-radius:3px;background:var(--lc)}
.line.closed .stations::before{background:repeating-linear-gradient(var(--lc) 0 7px,transparent 7px 13px);opacity:.5}
.st{position:relative;display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px 11px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.st::before{content:"";position:absolute;left:-21px;top:50%;width:13px;height:13px;margin-top:-6.5px;border-radius:50%;background:var(--card);border:3px solid var(--lc)}
.st.done::before{background:var(--lc)}
.st.boss::before{border-radius:3px;transform:rotate(45deg)}
.st:disabled{cursor:not-allowed;opacity:.55}
.st .t{min-width:0;font-size:14px}
.st .code{font-family:var(--mono);font-size:12px;color:var(--lc);font-weight:600}
.st .res{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--lc);font-weight:600}
@media (prefers-reduced-motion: no-preference){.st{transition:border-color .15s,transform .15s}.st:hover:not(:disabled){border-color:var(--lc);transform:translateX(2px)}}

/* play */
.q{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--rule)}
.q:first-of-type{border-top:0;padding-top:0}
.q .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.q>p{font-size:15.5px}
.opts{display:flex;flex-direction:column;gap:6px;counter-reset:o}
.opt{position:relative;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:9px;padding:9px 11px;cursor:pointer;background:var(--card);counter-increment:o}
.opt::before{content:counter(o,upper-alpha);font:700 12px var(--mono);color:var(--muted);border:1px solid var(--rule);border-radius:6px;min-width:22px;height:22px;display:inline-grid;place-items:center;flex:none}
.opt input{position:absolute;left:14px;top:14px;width:1px;height:1px;margin:0;opacity:0}
.opt:has(input:checked){border-color:var(--lc,var(--ink));background:var(--soft)}
.opt:has(input:checked)::before{background:var(--lc,var(--ink));color:#fff;border-color:transparent}
.opt:has(input:focus-visible){outline:2px solid var(--c2);outline-offset:2px}
.timer{font-family:var(--mono);font-weight:600}
.subbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:3;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.big{font:800 40px var(--display);letter-spacing:-.02em}

/* bars + dashboard */
.bars{display:grid;grid-template-columns:minmax(0,auto) minmax(40px,1fr) auto;gap:6px 10px;align-items:center;font-size:13px}
.bar{display:block;height:9px;background:var(--soft);border-radius:5px;overflow:hidden;min-width:40px}
.bar>i{display:block;height:100%;background:var(--zc,var(--c3));border-radius:5px}
.stack100{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft)}
.stack100 i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--lg)}

/* map */
.map{position:relative;background:var(--sea);border-radius:12px;overflow:hidden;border:1px solid var(--rule)}
.map svg{display:block;width:100%;height:auto}
.map .z{cursor:pointer;stroke:var(--edge);stroke-width:1.6;transition:opacity .15s,filter .15s}
.map .z:hover,.map .z:focus-visible{filter:brightness(1.12) saturate(1.1);outline:none}
.map.focus .z.other{opacity:.38}
.map .z.sel{stroke:var(--ink);stroke-width:4}
.map .ot{fill:var(--zot);stroke:var(--edge);stroke-width:1}
.map .ctx{fill:var(--land)}
.map .riv{fill:none;stroke:var(--river);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.map .outl{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round;pointer-events:none}
.map text{font-family:var(--display);paint-order:stroke;stroke:var(--card);stroke-width:6px;stroke-linejoin:round;fill:var(--ink);pointer-events:none}
.map .tag{font-size:26px;font-weight:700}
.map .code{font-weight:800;fill:var(--zcink);stroke:none}
.map .inset{fill:var(--card);stroke:var(--rule);stroke-width:2}
.map .cap{font-size:20px;font-weight:600;fill:var(--muted)}
.map .box{fill:transparent;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:9 6;cursor:pointer}
.maptools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;max-width:100%;overflow-x:auto}
.seg button{border:0;background:var(--card);color:var(--ink);font:600 12.5px var(--body);padding:6px 11px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.zlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.zlist button{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 9px;font:600 13px var(--body);cursor:pointer;text-align:left}
.zlist button[aria-pressed="true"]{border-color:var(--zc);box-shadow:inset 0 0 0 1px var(--zc)}
.srcnote{font-size:11.5px;color:var(--muted)}

/* governance sheet */
.steps{display:flex;flex-direction:column;gap:10px}
.stp{border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--card);min-width:0}
.stp.ok{border-color:var(--good)}
.stp h3{display:flex;gap:9px;align-items:baseline}
.stp h3 .k{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);font:800 12px var(--mono);flex:none;transform:translateY(-1px)}
.stp.ok h3 .k{background:var(--good);color:#fff}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--rule);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px;background:var(--card)}
.pick label:has(input:checked){border-color:var(--ink);background:var(--soft);font-weight:600}
.pick input{margin:0}
.alloc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 10px;align-items:center}
.alloc .nm{display:flex;flex-direction:column;min-width:0}
.alloc .nm small{color:var(--muted);font-size:11.5px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;border-radius:7px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font:700 16px var(--body);cursor:pointer}
.step output{font-family:var(--mono);width:22px;text-align:center;font-weight:600}
.dots{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.dots i{width:16px;height:16px;border-radius:4px;background:var(--soft);border:1px solid var(--rule)}
.dots i.on{background:var(--c3);border-color:transparent}

/* case study */
.case{max-width:80ch;display:flex;flex-direction:column;gap:12px;min-width:0}
.case h1{font-size:28px}
.case h2{font-size:20px;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.case h3{margin-top:6px}
.case p,.case li{line-height:1.65}
.case ul,.case ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.case blockquote{margin:0;padding:10px 14px;border-left:4px solid var(--c3);background:var(--card);border-radius:0 8px 8px 0;font-size:14px}
.case .tbl{background:var(--card);border:1px solid var(--rule);border-radius:8px}
.case .ref{font-family:var(--mono);font-size:.8em;color:var(--muted);white-space:nowrap}
.case .zt td:first-child{white-space:nowrap}
.case hr{border:0;border-top:1px solid var(--rule);width:100%}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:12.5px;color:var(--ink);text-decoration:none;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;background:var(--card)}
</style>
</head>
<body>
<header><div class="in">
  <div class="brand">
    <div class="logo"><svg width="28" height="28" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 17 L11 9 L15 14 L20 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>Region Arena</b><div class="zen">ZenRoad · @chuonghn · MEM4007 · v1.3</div></div></div>
    <div class="me" id="me"></div>
  </div>
  <nav id="nav" aria-label="Khu vực"></nav>
</div></header>
<main class="wrap" id="main"><p class="muted">Đang tải…</p></main>
<div class="toast" id="toast" hidden></div>

<script src="config.js?v=dfae2626" charset="utf-8"></script>
<script src="map.js?v=c432d33c" charset="utf-8"></script>
<script src="case.js?v=abda73d6" charset="utf-8"></script>
<script>
(function(){
'use strict';
var API=window.RA_API||'';
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(t){var e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true;},3500);}
function pct(r,n){return n?Math.round(100*r/n):0;}
function fmtNum(x){return String(Math.round(x*100)/100).replace('.',',');}
function clock(ms){var s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

  tabs.push(['out','Đăng xuất']);

$('nav').addEventListener('click',function(e){var b=e.target.closest('button[data-tab]');if(!b)return;
  if(PLAY&&!PLAY.done&&PLAY.kind==='boss')return toast('Đang làm bài Trùm: nộp bài trước khi rời.');

  if(TAB==='map'&&teacher()&&!BOARD)loadBoard();});

function teachDos(a,b){

// same rule as the Worker: dossier (or 0 once a round ran) + every round that has run (0 without a sheet)
function roundMeanJS(dos,scores,done){var p=[];if(dos!=null)p.push(dos);else if(done.length)p.push(0);done.forEach(function(n){p.push(scores[n]==null?0:scores[n]);});return p.length?p.reduce(function(a,b){return a+b;},0)/p.length:null;}
function scoreRows(){var ts=BOARD.cfg.teams||{},done=BOARD.done||[];
  return BOARD.users.map(function(x){var p=BOARD.progs[x.u]||null,t=teamOfU(x.u),ss=stationScore(p),rs=null;

  return h+'<div class="panel"><div class="row" style="justify-content:space-between"><h3>Bảng điểm</h3><button class="btn ghost sm" data-act="csv">Tải CSV</button></div><div class="tbl"><table><thead><tr><th>Tên đăng nhập</th><th>Họ và tên</th><th>Nhóm</th><th class="num">Trạm</th><th class="num">Vòng</th><th class="num">Game /10</th><th class="num">XP</th>'+[1,2,3,4,5,6].map(function(c){return '<th class="num">CLO'+c+'</th>';}).join('')+'</tr></thead><tbody>'+
   rows.map(function(r){return '<tr><td class="mono">'+esc(r.u)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.team)+'</td><td class="num">'+(r.st==null?'—':pct(r.st,1)+'%')+'</td><td class="num">'+(r.rd==null?'—':fmtNum(r.rd*10))+'</td><td class="num"><b>'+(r.g==null?'—':fmtNum(r.g))+'</b></td><td class="num">'+r.xp+'</td>'+r.clo.map(function(c){return '<td class="num">'+(c==null?'—':c+'%')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div></div>';}

  var csv='﻿'+rows.map(function(r){return r.map(q).join(',');}).join('\n'),a=document.createElement('a');
