<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Region Arena</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#18202a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* v1.1 layout: a city-planning office. Dark masthead with rank + XP; the course is a metro network (5 lines);
   the city map (TP.HCM mới, 6 game zones) is the hub of the governance round; the case study is a readable dossier.
   One column on phones, two columns from 900 px. Zone colours are tokens shared by map, chips and dashboards. */
:root{
  --paper:#f2f3ef; --card:#ffffff; --ink:#18202a; --muted:#5d6672; --rule:#d9ddd8; --soft:#e9ece6; --mast:#18202a; --mastink:#eef1ec;
  --c1:#0f7b74; --c2:#4a4fb3; --c3:#c27a00; --c4:#b8334a; --c5:#2f7d32;
  --v1:#c8463d; --v2:#7a55b3; --v3:#b0662a; --v4:#0f7b74; --v5:#6c8a2a; --v6:#2a86b0; --v7:#3a8a3f; --v8:#2f4f9e; --v9:#cc8a10; --v10:#b8336f; --zot:#cdd2cb;
  --sea:#dbe8f0; --land:#eceee7; --river:#6f9dc3; --edge:#ffffff; --zcink:#ffffff;
  --good:#1d7a46; --warn:#b26a00; --bad:#b3261e;
  --display:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161b; --card:#1a2027; --ink:#e7eae6; --muted:#9aa3ad; --rule:#2c343d; --soft:#222a32; --mast:#0c1014; --mastink:#e7eae6;
  --c1:#3fb8ad; --c2:#8d92f0; --c3:#f0a93a; --c4:#ec6a80; --c5:#6cc070;
  --v1:#ec7a70; --v2:#a98ae0; --v3:#e09a5c; --v4:#3fb8ad; --v5:#a9c45a; --v6:#5cb8e0; --v7:#6cc070; --v8:#7f9ff0; --v9:#f0b445; --v10:#ec7aa8; --zot:#3a434c;
  --sea:#14212b; --land:#222a31; --river:#3f6f96; --edge:#12161b; --zcink:#12161b;
  --good:#5cc489; --warn:#f0a93a; --bad:#ff7a70; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161b; --card:#1a2027; --ink:#e7eae6; --muted:#9aa3ad; --rule:#2c343d; --soft:#222a32; --mast:#0c1014; --mastink:#e7eae6;
  --c1:#3fb8ad; --c2:#8d92f0; --c3:#f0a93a; --c4:#ec6a80; --c5:#6cc070;
  --v1:#ec7a70; --v2:#a98ae0; --v3:#e09a5c; --v4:#3fb8ad; --v5:#a9c45a; --v6:#5cb8e0; --v7:#6cc070; --v8:#7f9ff0; --v9:#f0b445; --v10:#ec7aa8; --zot:#3a434c;
  --sea:#14212b; --land:#222a31; --river:#3f6f96; --edge:#12161b; --zcink:#12161b;
  --good:#5cc489; --warn:#f0a93a; --bad:#ff7a70; color-scheme:dark}
*{box-sizing:border-box}
html{padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}

/* masthead */
header{position:sticky;top:0;z-index:5;background:var(--mast);color:var(--mastink);padding-top:env(safe-area-inset-top,0px)}
header .in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo b{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.zen{font-size:10.5px;opacity:.7;letter-spacing:.08em;text-transform:uppercase}
.me{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;min-width:0}
.me .who{font-weight:700}
.me .u{font-family:var(--mono);opacity:.7}
.xp{display:flex;flex-direction:column;gap:3px;min-width:150px}
.xp .t{display:flex;justify-content:space-between;gap:8px;font-size:11.5px}
.xp .t b{font-family:var(--mono)}
.xpbar{height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--c3),#f6c35b)}
.zchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px 2px 4px;font-size:12px;font-weight:600;background:rgba(255,255,255,.1)}
.zchip i{display:inline-grid;place-items:center;min-width:22px;height:18px;border-radius:9px;background:var(--zc);color:#fff;font:800 10.5px var(--mono);font-style:normal;padding:0 4px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-6px}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:inherit;opacity:.72;font:600 13.5px var(--body);padding:9px 12px 11px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
nav button[aria-current="true"]{opacity:1;border-bottom-color:var(--c3)}
nav button:hover{opacity:1}
nav button[data-tab="out"]{margin-left:auto}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--c2);outline-offset:2px}

/* type + basics */
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
h2{font-size:18px;font-weight:700;line-height:1.3}
h3{font-size:15px;font-weight:700}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c3)}
.pagehead{display:flex;flex-direction:column;gap:6px;max-width:68ch}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.accent{border-top:4px solid var(--zc,var(--c3))}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:900px){.grid2{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.grid2 .sticky{position:sticky;top:120px}}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--card);font:600 14px var(--body);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--soft)}
.chip.good{color:var(--good);border-color:currentColor;background:none}
.chip.warn{color:var(--warn);border-color:currentColor;background:none}
.zc{display:inline-grid;place-items:center;min-width:28px;height:22px;border-radius:11px;background:var(--zc);color:var(--zcink);font:800 11.5px var(--mono);padding:0 6px;flex:none}
input[type=text],input[type=password],input[type=number],select,textarea{font:15px var(--body);padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);min-width:0;max-width:100%}
select{width:100%}
textarea{font-family:var(--mono);font-size:13px;width:100%;min-height:9em}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--rule);padding-left:9px}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:800 28px var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

/* login */
.login{max-width:440px;margin:6vh auto 0;overflow:hidden;padding:0}
.login .hero{background:var(--mast);color:var(--mastink);padding:18px 18px 14px;display:flex;flex-direction:column;gap:6px}
.login .hero svg{width:100%;height:auto;max-height:190px}
.login form{padding:16px;display:flex;flex-direction:column;gap:8px}

/* route: metro network */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lines{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:900px){.lines{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.line{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--lc);min-width:0}
.line.closed{border-top-style:dashed}
.lhead{display:flex;align-items:center;gap:10px}
.lbadge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--lc);color:#fff;font:800 14px var(--display);flex:none}
.lprog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.lprog .bar{flex:1}
.stations{list-style:none;margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:6px;position:relative}
.stations::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:5px;border-radius:3px;background:var(--lc)}
.line.closed .stations::before{background:repeating-linear-gradient(var(--lc) 0 7px,transparent 7px 13px);opacity:.5}
.st{position:relative;display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px 11px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.st::before{content:"";position:absolute;left:-21px;top:50%;width:13px;height:13px;margin-top:-6.5px;border-radius:50%;background:var(--card);border:3px solid var(--lc)}
.st.done::before{background:var(--lc)}
.st.boss::before{border-radius:3px;transform:rotate(45deg)}
.st:disabled{cursor:not-allowed;opacity:.55}
.st .t{min-width:0;font-size:14px}
.st .code{font-family:var(--mono);font-size:12px;color:var(--lc);font-weight:600}
.st .res{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--lc);font-weight:600}
@media (prefers-reduced-motion: no-preference){.st{transition:border-color .15s,transform .15s}.st:hover:not(:disabled){border-color:var(--lc);transform:translateX(2px)}}

/* play */
.q{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--rule)}
.q:first-of-type{border-top:0;padding-top:0}
.q .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.q>p{font-size:15.5px}
.opts{display:flex;flex-direction:column;gap:6px;counter-reset:o}
.opt{position:relative;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:9px;padding:9px 11px;cursor:pointer;background:var(--card);counter-increment:o}
.opt::before{content:counter(o,upper-alpha);font:700 12px var(--mono);color:var(--muted);border:1px solid var(--rule);border-radius:6px;min-width:22px;height:22px;display:inline-grid;place-items:center;flex:none}
.opt input{position:absolute;left:14px;top:14px;width:1px;height:1px;margin:0;opacity:0}
.opt:has(input:checked){border-color:var(--lc,var(--ink));background:var(--soft)}
.opt:has(input:checked)::before{background:var(--lc,var(--ink));color:#fff;border-color:transparent}
.opt:has(input:focus-visible){outline:2px solid var(--c2);outline-offset:2px}
.timer{font-family:var(--mono);font-weight:600}
.subbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:3;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.big{font:800 40px var(--display);letter-spacing:-.02em}

/* bars + dashboard */
.bars{display:grid;grid-template-columns:minmax(0,auto) minmax(40px,1fr) auto;gap:6px 10px;align-items:center;font-size:13px}
.bar{display:block;height:9px;background:var(--soft);border-radius:5px;overflow:hidden;min-width:40px}
.bar>i{display:block;height:100%;background:var(--zc,var(--c3));border-radius:5px}
.stack100{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft)}
.stack100 i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--lg)}

/* map */
.map{position:relative;background:var(--sea);border-radius:12px;overflow:hidden;border:1px solid var(--rule)}
.map svg{display:block;width:100%;height:auto}
.map .z{cursor:pointer;stroke:var(--edge);stroke-width:1.6;transition:opacity .15s,filter .15s}
.map .z:hover,.map .z:focus-visible{filter:brightness(1.12) saturate(1.1);outline:none}
.map.focus .z.other{opacity:.38}
.map .z.sel{stroke:var(--ink);stroke-width:4}
.map .ot{fill:var(--zot);stroke:var(--edge);stroke-width:1}
.map .ctx{fill:var(--land)}
.map .riv{fill:none;stroke:var(--river);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.map .outl{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round;pointer-events:none}
.map text{font-family:var(--display);paint-order:stroke;stroke:var(--card);stroke-width:6px;stroke-linejoin:round;fill:var(--ink);pointer-events:none}
.map .tag{font-size:26px;font-weight:700}
.map .code{font-weight:800;fill:var(--zcink);stroke:none}
.map .inset{fill:var(--card);stroke:var(--rule);stroke-width:2}
.map .cap{font-size:20px;font-weight:600;fill:var(--muted)}
.map .box{fill:transparent;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:9 6;cursor:pointer}
.maptools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;max-width:100%;overflow-x:auto}
.seg button{border:0;background:var(--card);color:var(--ink);font:600 12.5px var(--body);padding:6px 11px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.zlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.zlist button{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 9px;font:600 13px var(--body);cursor:pointer;text-align:left}
.zlist button[aria-pressed="true"]{border-color:var(--zc);box-shadow:inset 0 0 0 1px var(--zc)}
.srcnote{font-size:11.5px;color:var(--muted)}

/* governance sheet */
.steps{display:flex;flex-direction:column;gap:10px}
.stp{border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--card);min-width:0}
.stp.ok{border-color:var(--good)}
.stp h3{display:flex;gap:9px;align-items:baseline}
.stp h3 .k{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);font:800 12px var(--mono);flex:none;transform:translateY(-1px)}
.stp.ok h3 .k{background:var(--good);color:#fff}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--rule);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px;background:var(--card)}
.pick label:has(input:checked){border-color:var(--ink);background:var(--soft);font-weight:600}
.pick input{margin:0}
.alloc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 10px;align-items:center}
.alloc .nm{display:flex;flex-direction:column;min-width:0}
.alloc .nm small{color:var(--muted);font-size:11.5px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;border-radius:7px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font:700 16px var(--body);cursor:pointer}
.step output{font-family:var(--mono);width:22px;text-align:center;font-weight:600}
.dots{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.dots i{width:16px;height:16px;border-radius:4px;background:var(--soft);border:1px solid var(--rule)}
.dots i.on{background:var(--c3);border-color:transparent}

/* case study */
.case{max-width:80ch;display:flex;flex-direction:column;gap:12px;min-width:0}
.case h1{font-size:28px}
.case h2{font-size:20px;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.case h3{margin-top:6px}
.case p,.case li{line-height:1.65}
.case ul,.case ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.case blockquote{margin:0;padding:10px 14px;border-left:4px solid var(--c3);background:var(--card);border-radius:0 8px 8px 0;font-size:14px}
.case .tbl{background:var(--card);border:1px solid var(--rule);border-radius:8px}
.case .ref{font-family:var(--mono);font-size:.8em;color:var(--muted);white-space:nowrap}
.case .zt td:first-child{white-space:nowrap}
.case hr{border:0;border-top:1px solid var(--rule);width:100%}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:12.5px;color:var(--ink);text-decoration:none;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;background:var(--card)}
</style>
</head>
<body>
<header><div class="in">
  <div class="brand">
    <div class="logo"><svg width="28" height="28" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 17 L11 9 L15 14 L20 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>Region Arena</b><div class="zen">ZenRoad · @chuonghn · MEM4007 · v1.2.1</div></div></div>
    <div class="me" id="me"></div>
  </div>
  <nav id="nav" aria-label="Khu vực"></nav>
</div></header>
<main class="wrap" id="main"><p class="muted">Đang tải…</p></main>
<div class="toast" id="toast" hidden></div>

<script src="config.js" charset="utf-8"></script>
<script src="map.js" charset="utf-8"></script>
<script src="case.js" charset="utf-8"></script>
<script>
(function(){
'use strict';
var API=window.RA_API||'';
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(t){var e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true;},3500);}
function pct(r,n){return n?Math.round(100*r/n):0;}
function fmtNum(x){return String(Math.round(x*100)/100).replace('.',',');}
function clock(ms){var s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

function teacher(){return ME&&ME.role==='teacher';}

function keepScroll(f){var y=window.scrollY;f();window.scrollTo(0,y);}

function logout(expired){try{localStorage.removeItem('ra-t');}catch(e){}ME=null;PLAY=null;BOARD=null;RD=null;render();if(expired)toast(ERR.auth);}
function loadMe(){return api('me').then(function(res){if(!res.ok){if(res.error!=='auth'){$('main').innerHTML='<p class="err">'+esc(errText(res.error))+'</p>';}return;}
  ME={u:res.u,name:res.name,role:res.role};STAGES=res.stages;CFG=res.cfg;PROG=res.prog||null;TEAM=res.team||null;RSCORE=res.roundScore;
  if(teacher()&&TAB==='route'&&!loadMe.once){TAB='teach';}loadMe.once=true;render();});}
function boot(){if(!API){$('main').innerHTML='<p class="err">Chưa có địa chỉ máy chủ trong config.js.</p>';return;}
  var t=null;try{t=localStorage.getItem('ra-t');}catch(e){}if(!t){render();return;}loadMe();}
// polling: 8 s while a round is open (students on the round tab, teacher on Vòng/Điểm), otherwise 30 s; none on the map and case pages
var lastPoll=0;
setInterval(function(){if(!ME||PLAY||BUSY||document.hidden||TAB==='case'||TAB==='map')return;var live=CFG.round&&(CFG.round.status==='open'||CFG.round.status==='running');
  var hot=teacher()?(TAB==='teach'&&(TTAB==='round'||TTAB==='score')):(TAB==='round'&&live);
  if(Date.now()-lastPoll<(hot?8000:30000))return;lastPoll=Date.now();
  if(teacher()){if(TAB==='teach')loadBoard();}else if(TAB==='round')loadRound().then(loadMe);else loadMe();},2000);

/* ---------- header + nav ---------- */
function renderHead(){
  if(!ME){$('me').innerHTML='';$('nav').innerHTML='';return;}
  if(teacher())$('me').innerHTML='<span class="who">Giảng viên</span><span class="zchip"><i style="--zc:var(--c3)">GV</i>Chủ tịch UBND Thành phố</span>';
  else{var xp=xpOf(PROG),nx=nextRank(xp),f=nx?pct(xp-nx.from,nx.at-nx.from):100;
    $('me').innerHTML='<span><span class="who">'+esc(ME.name||ME.u)+'</span> <span class="u">'+esc(ME.u)+'</span></span>'+
      (TEAM?'<span class="zchip"><i style="--zc:'+zvar(TEAM.zone)+'">'+esc(TEAM.zone)+'</i>'+esc(TEAM.name)+'</span>':'<span class="zchip"><i style="--zc:var(--muted)">–</i>chưa xếp nhóm</span>')+
      '<span class="xp"><span class="t"><span>'+esc(rankOf(xp))+'</span><b>'+xp+' XP</b></span><span class="xpbar" title="'+(nx?'Còn '+(nx.at-xp)+' XP tới '+esc(nx.name):'Cấp cao nhất')+'"><i style="width:'+f+'%"></i></span></span>';}
  var tabs=teacher()?[['teach','Bảng giáo viên'],['map','Bản đồ'],['case','Trường hợp TP.HCM'],['route','Thử hành trình']]:[['route','Hành trình'],['map','Bản đồ'],['round','Vòng điều hành'],['case','Trường hợp TP.HCM'],['mine','Kết quả của tôi']];
  tabs.push(['out','Đăng xuất']);
  $('nav').innerHTML=tabs.map(function(x){return '<button type="button" data-tab="'+x[0]+'" aria-current="'+(TAB===x[0]&&!PLAY)+'">'+x[1]+'</button>';}).join('');}
$('nav').addEventListener('click',function(e){var b=e.target.closest('button[data-tab]');if(!b)return;
  if(PLAY&&!PLAY.done&&PLAY.kind==='boss')return toast('Đang làm bài Trùm: nộp bài trước khi rời.');
  if(b.dataset.tab==='out'){if(!logout.arm){logout.arm=true;b.textContent='Bấm lần nữa để đăng xuất';setTimeout(function(){logout.arm=false;renderHead();},4000);return;}logout.arm=false;logout();return;}
  PLAY=null;TAB=b.dataset.tab;render();window.scrollTo(0,0);
  if(TAB==='round')loadRound();if(TAB==='teach')loadBoard();if(TAB==='mine'||TAB==='route')loadMe();
  if(TAB==='map'&&teacher()&&!BOARD)loadBoard();});

function render(){renderHead();var m=$('main');
  if(!ME){m.innerHTML=viewLogin();return;}
  if(PLAY){m.innerHTML=viewPlay();return;}
  m.innerHTML=TAB==='route'?viewRoute():TAB==='round'?viewRound():TAB==='mine'?viewMine():TAB==='map'?viewMap():TAB==='case'?viewCase():viewTeach();}

function mapSVG(o){var M=window.RA_MAP;if(!M)return '<p class="muted small">Chưa tải được bản đồ.</p>';var tags=o.tags||{};
  function zpath(z,d){if(z==='OT')return '<path class="ot" d="'+d+'"><title>Phần còn lại của TP.HCM cũ: không có nhóm điều hành</title></path>';
    return '<path class="z'+(o.sel===z?' sel':'')+(o.mine&&z!==o.mine?' other':'')+'" d="'+d+'" style="fill:'+zvar(z)+'" data-zone="'+z+'" tabindex="0" role="button" aria-label="'+z+' '+esc(ZONES[z])+'"><title>'+z+' · '+esc(ZONES[z])+'</title></path>';}
  function badge(z,x,y,r){return '<g data-zone="'+z+'" style="cursor:pointer"><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+zvar(z)+'" stroke="var(--card)" stroke-width="4"/><text class="code" x="'+x+'" y="'+(y+r*0.36)+'" text-anchor="middle" style="font-size:'+Math.round(r*0.95)+'px">'+z+'</text></g>';}
  function tag(z,x,y){var t=tags[z];if(o.mine===z)t=(t?t+' · ':'')+'nhóm bạn';return t?'<text class="tag" x="'+x+'" y="'+y+'" text-anchor="middle">'+esc(t)+'</text>':'';}
  var h;
  if(o.view==='core'){var C=M.core;
    h='<svg viewBox="0 0 '+C.w+' '+C.h+'" role="img" aria-label="Nội đô phóng to: V1 và các vùng giáp"><rect width="'+C.w+'" height="'+C.h+'" fill="var(--sea)"/>';
    Object.keys(C.zones).forEach(function(z){h+=zpath(z,C.zones[z]);});
    h+='<path d="'+C.districts+'" fill="none" stroke="var(--edge)" stroke-width="1.2" opacity=".55" pointer-events="none"/><path class="riv" d="'+C.rivers+'" style="stroke-width:5"/>';
    Object.keys(C.labels).forEach(function(z){var p=C.labels[z];if(ZONES[z])h+=badge(z,p[0],p[1],z==='V1'?38:30)+tag(z,p[0],p[1]+66);});
    h+=scale(C.w-40,C.h-30,C.km*2,'2 km')+'</svg>';}
  else{var W=M.w,H=M.h,L=M.labels,b=M.core.box;
    h='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bản đồ TP.HCM mới với 10 vùng quản trị phát triển"><rect width="'+W+'" height="'+H+'" fill="var(--sea)"/><path class="ctx" d="'+M.ctx+'"/>';
    Object.keys(M.zones).forEach(function(z){h+=zpath(z,M.zones[z]);});
    h+='<path class="riv" d="'+M.rivers+'"/><path class="outl" d="'+M.outline+'"/>';
    ['V1'].forEach(function(z){if(tags[z]||o.mine===z||o.sel===z){var p=L[z];h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="10" fill="'+zvar(z)+'" stroke="var(--ink)" stroke-width="3" pointer-events="none"/>';}});
    h+='<rect class="box" x="'+b[0]+'" y="'+b[1]+'" width="'+b[2]+'" height="'+b[3]+'" data-mapview="core"><title>Phóng to nội đô (V1)</title></rect>';
    h+='<g data-mapview="core" style="cursor:pointer"><rect x="'+(b[0]-6)+'" y="'+(b[1]-46)+'" width="'+(b[2]+12)+'" height="38" rx="19" fill="var(--ink)"/><text x="'+(b[0]+b[2]/2)+'" y="'+(b[1]-19)+'" text-anchor="middle" style="fill:var(--card);stroke:none;font-size:21px;font-weight:700">V1 · nội đô ⤢</text></g>';
    var NUDGE={V2:[42,18]};   // keep V2's badge clear of the inner-city pill
    ['V2','V3','V4','V5','V6','V7','V8','V9'].forEach(function(z){var p=L[z];if(!p)return;var d=NUDGE[z]||[0,0],x=p[0]+d[0],y=p[1]+d[1];h+=badge(z,x,y,26)+tag(z,x,y+50);});
    // Côn Đảo inset (bottom left); Vietnam locator incl. Hoàng Sa, Trường Sa (top right)
    var cd=M.condao,cw=250,ch=Math.round(cd.h*cw/cd.w),cx=18,cy=H-ch-60;
    h+='<g><rect class="inset" x="'+cx+'" y="'+cy+'" width="'+cw+'" height="'+(ch+42)+'" rx="10"/><g transform="translate('+cx+' '+cy+') scale('+(cw/cd.w)+')"><rect width="'+cd.w+'" height="'+cd.h+'" fill="var(--sea)"/><path class="z'+(o.sel==='V10'?' sel':'')+(o.mine&&o.mine!=='V10'?' other':'')+'" d="'+cd.path+'" style="fill:var(--v10);stroke-width:1" data-zone="V10"><title>V10 · Đặc khu Côn Đảo</title></path></g>'+

function profileBars(z,vals){return '<div class="bars" style="--zc:'+zvar(z)+'">'+DIMS.map(function(k){return '<span class="small">'+DIMNAME[k]+' <span class="mono muted">'+k+'</span></span><span class="bar"><i style="width:'+vals[k]+'%"></i></span><span class="mono small">'+fmtNum(vals[k])+'</span>';}).join('')+'</div>';}
function empBar(emp){var t=emp.reduce(function(a,b){return a+b;},0)||1;return '<div class="stack100" role="img" aria-label="Cơ cấu việc làm 5 ngành">'+emp.map(function(v,i){return '<i style="width:'+(100*v/t)+'%;background:'+SECCOL[i]+'" title="'+esc(SECTORS[i])+' '+Math.round(100*v/t)+'%"></i>';}).join('')+'</div><div class="legend">'+SECTORS.map(function(s,i){return '<span style="--lg:'+SECCOL[i]+'">'+esc(s)+' '+Math.round(100*emp[i]/t)+'%</span>';}).join('')+'</div>';}
function devOf(v){return Math.round((v.NS+v.VL+v.MT+v.DS)/4*10)/10;}
function zoneCard(z,extra){var I=ZONEINFO[z],P=(window.RA_Z0||{})[z];
  var h='<div class="panel accent" style="--zc:'+zvar(z)+'"><div class="row">'+zc(z)+'<h2>'+esc(ZONES[z])+'</h2></div>'+
    '<p class="small"><b>Phạm vi ước lượng trên bản đồ:</b> '+esc(I.area)+' <span class="muted">(quận/huyện trước 2025)</span></p><p class="small"><b>Vai trò:</b> '+esc(I.role)+'.</p><p class="small"><b>Căng thẳng chính sách:</b> '+esc(I.tension)+'.</p>'+(extra||'');

function tagLegend(tags){return '<div class="zlist">'+ZIDS.map(function(z){return '<span class="row" style="flex-wrap:nowrap;gap:6px;font-size:13px" data-ztag="'+z+'">'+zc(z)+'<b class="mono">'+esc(tags[z]||'')+'</b></span>';}).join('')+'</div>';}

/* ---------- route ---------- */
function viewRoute(){var first=(PROG&&PROG.first)||{},tot=0,done=0,openN=0;
  LINES.forEach(function(L){if(!gateOpen(L.ch))return;openN++;stopsOf(L.ch).forEach(function(s){tot++;if(first[s])done++;});});
  var ss=stationScore(PROG);
  var h='<section class="stack"><div class="pagehead"><span class="kicker">Hành trình học phần</span><h1>Mạng lưới 5 tuyến</h1><p class="muted">Mỗi ga là một mục đề cương: 6 câu, làm hết rồi nộp một lần, chỉ báo tổng số câu đúng. <b>Lần làm đầu</b> được tính vào điểm quá trình; làm lại chỉ để luyện và lấy XP. Ga ◆ cuối mỗi tuyến là Trùm: 10 câu, 15 phút.</p>'+(teacher()?'<p class="note">Giảng viên chơi thử mọi tuyến; kết quả không được ghi.</p>':'')+'</div>';
  if(!teacher())h+='<div class="summary"><div class="panel stat"><span class="label">Tuyến đang mở</span><b>'+openN+'/5</b></div><div class="panel stat"><span class="label">Ga đã qua</span><b>'+done+'/'+tot+'</b></div><div class="panel stat"><span class="label">Đúng lần đầu</span><b>'+(ss==null?'—':pct(ss,1)+'%')+'</b></div></div>';
  h+='<div class="lines">';
  LINES.forEach(function(L){var open=gateOpen(L.ch),secs=sectionsOf(L.ch),allTried=secs.every(function(s){return first[s];}),nd=stopsOf(L.ch).filter(function(s){return first[s];}).length,ns=secs.length+1;
    h+='<div class="line'+(open?'':' closed')+'" style="--lc:var(--c'+L.ch+')"><div class="lhead"><span class="lbadge">C'+L.ch+'</span><div style="min-width:0"><h2>'+esc(L.name)+'</h2><p class="small muted">'+esc(L.topic)+' · '+L.buoi+'</p></div></div>'+
      (open?'<div class="lprog"><span class="bar" style="--zc:var(--lc)"><i style="width:'+pct(nd,ns)+'%"></i></span><span class="mono">'+nd+'/'+ns+' ga</span></div>':'<p class="small"><span class="chip">🔒 giảng viên chưa mở</span></p>')+'<ol class="stations">';
    secs.forEach(function(s){var r=first[s];h+='<li><button type="button" class="st'+(r?' done':'')+'" data-stop="'+s+'"'+(open?'':' disabled')+'><span class="t"><span class="code">'+s+'</span> '+esc(STAGES[s])+'</span><span class="res">'+(r?'✓ '+r[0]+'/'+r[1]:'')+'</span></button></li>';});
    var bid=L.ch+'.★',br=first[bid],bossOk=open&&(allTried||teacher());
    h+='<li><button type="button" class="st boss'+(br?' done':'')+'" data-stop="'+bid+'"'+(bossOk?'':' disabled')+'><span class="t"><span class="code">◆ Trùm</span> Tổng ôn C'+L.ch+(allTried||teacher()?'':' <span class="small muted">(làm hết các ga trước)</span>')+'</span><span class="res">'+(br?'✓ '+br[0]+'/'+br[1]:'')+'</span></button></li></ol></div>';});
  return h+'</div></section>';}
document.addEventListener('click',function(e){var b=e.target.closest('[data-stop]');if(!b||b.disabled||BUSY)return;startStop(b.dataset.stop);});

/* ---------- play ---------- */
function startStop(id){BUSY=true;api('start',{stop:id}).then(function(res){BUSY=false;if(!res.ok)return toast(errText(res.error));
  var boss=id.indexOf('★')>0;PLAY={id:id,kind:boss?'boss':'stop',ch:+id.charAt(0),aid:res.aid,qs:res.qs.map(function(q){return Object.assign({ans:null},q);}),end:res.deadline,done:null};
  if(boss){clearInterval(startStop.t);startStop.t=setInterval(function(){if(!PLAY||PLAY.done){clearInterval(startStop.t);return;}var left=PLAY.end-Date.now(),t=$('tmr');if(t)t.textContent=clock(left);if(left<=0){clearInterval(startStop.t);submitPlay(true);}},1000);}
  render();window.scrollTo(0,0);});}
function fmtQ(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');}
function leftCount(){return PLAY.qs.filter(function(q){return q.ans==null||q.ans==='';}).length;}
function viewPlay(){var P=PLAY,L=LINES[P.ch-1],title=P.kind==='boss'?'◆ Trùm tuyến C'+P.ch+': '+L.name:P.id+' · '+STAGES[P.id];
  var h='<section class="stack" style="--lc:var(--c'+P.ch+');max-width:780px"><div class="pagehead"><span class="kicker" style="color:var(--lc)">Tuyến C'+P.ch+' · '+esc(L.name)+'</span><div class="row" style="justify-content:space-between"><h1 style="font-size:22px">'+esc(title)+'</h1>'+(P.kind==='boss'&&!P.done?'<span class="chip timer" id="tmr">'+clock(P.end-Date.now())+'</span>':'')+'</div></div>';
  if(P.done){var d=P.done;
    return h+'<div class="panel accent" style="--zc:var(--lc)"><p class="label">Kết quả</p><p class="big">Đúng '+d.r+'/'+d.n+'</p><p>'+(d.trial?'<span class="chip">giảng viên thử: không ghi</span>':'+'+d.xp+' XP · '+(d.counted?'<span class="chip good">lần làm đầu: được tính điểm quá trình</span>':'<span class="chip">làm lại: chỉ tính XP</span>'))+(d.late?' · <span class="chip warn">nộp sau giờ</span>':'')+'</p><p class="small muted">Game chỉ báo tổng số câu đúng, không báo câu nào đúng, câu nào sai.</p><div class="row"><button class="btn" data-act="back">Về hành trình</button>'+(P.kind==='stop'?'<button class="btn ghost" data-act="again">Làm bộ câu khác</button>':'')+'</div></div></section>';}
  h+='<div class="panel">';
  P.qs.forEach(function(q,i){h+='<div class="q"><span class="n">Câu '+(i+1)+'/'+P.qs.length+'</span><p>'+fmtQ(q.q)+'</p>';
    if(q.type==='mc'){h+='<div class="opts">';q.o.forEach(function(o,k){h+='<label class="opt"><input type="radio" name="q'+i+'" value="'+k+'"'+(q.ans===k?' checked':'')+'><span>'+esc(o)+'</span></label>';});h+='</div>';}
    else h+='<div class="row"><input type="text" inputmode="decimal" data-num="'+i+'" value="'+esc(q.ans==null?'':q.ans)+'" placeholder="Nhập số, ví dụ 1,25" aria-label="Đáp số câu '+(i+1)+'">'+(q.unit?'<span class="muted">'+esc(q.unit)+'</span>':'')+'<span class="small muted">sai số cho phép ±'+Math.round(q.tol*100)+'%</span></div>';
    h+='</div>';});
  var left=leftCount();
  return h+'</div><div class="panel subbar"><p class="small" id="leftp">'+(left?'Còn <b>'+left+'</b> câu chưa trả lời.':'Đã trả lời đủ. Nộp bài để xem tổng số câu đúng.')+'</p><div class="row"><button class="btn" data-act="submit"'+(left&&P.kind!=='boss'?' disabled':'')+'>Nộp bài</button>'+(P.kind==='stop'?'<button class="btn ghost" data-act="back">Bỏ, về hành trình</button>':'')+'</div></div></section>';}
function refreshSubmit(){var left=leftCount(),b=document.querySelector('[data-act="submit"]');if(b)b.disabled=!!left&&PLAY.kind!=='boss';var p=$('leftp');if(p)p.innerHTML=left?'Còn <b>'+left+'</b> câu chưa trả lời.':'Đã trả lời đủ. Nộp bài để xem tổng số câu đúng.';}
document.addEventListener('change',function(e){var t=e.target;if(PLAY&&!PLAY.done&&t.type==='radio'&&/^q\d+$/.test(t.name)){PLAY.qs[+t.name.slice(1)].ans=+t.value;refreshSubmit();}});
document.addEventListener('input',function(e){var t=e.target;if(PLAY&&!PLAY.done&&t.dataset.num!=null){PLAY.qs[+t.dataset.num].ans=t.value.trim();refreshSubmit();}});
function submitPlay(timeout){var P=PLAY;if(!P||P.done||BUSY)return;BUSY=true;clearInterval(startStop.t);var b=document.querySelector('[data-act="submit"]');if(b)b.disabled=true;
  api('submit',{aid:P.aid,ans:P.qs.map(function(q){return q.ans;})}).then(function(res){BUSY=false;
    if(!res.ok){if(b)b.disabled=false;return toast(errText(res.error));}
    P.done=res;if(timeout)P.done.late=P.done.late||false;loadMe();render();window.scrollTo(0,0);});}
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='submit')submitPlay(false);
  else if(a==='back'){PLAY=null;TAB='route';render();}
  else if(a==='again'){startStop(PLAY.id);}
  else if(a==='sheet')submitSheet(b);
  else if(a==='csv')downloadCsv();});

   (rd.status==='closed'?'<button class="btn" data-tact="openround">Mở vòng 1</button>':'')+
   (rd.status==='open'||rd.status==='running'?'<button class="btn" data-tact="runround" data-step="'+(teachAct.armRun?'2':'1')+'">'+(teachAct.armRun?'Bấm lần nữa: đóng phiếu và chạy mô phỏng':'Đóng vòng và chạy mô phỏng')+'</button>':'')+
   (rd.status!=='closed'?'<button class="btn ghost" data-tact="resetround" data-step="'+(teachAct.armRR?'2':'1')+'">'+(teachAct.armRR?'Bấm lần nữa: xoá phiếu và kết quả vòng':'Đặt lại vòng')+'</button>':'')+'</div><p class="small muted">Vòng 2 (chiến lược) và vòng 3 (vùng đô thị đặc biệt) mở ở bản sau.</p></div>';
  if(r1){var mx=Math.max.apply(null,ZIDS.map(function(y){return r1[y]?r1[y].inv:0;}))||1;
    h+='<div class="panel"><h3>Đầu tư mới chia theo sức hút và ưu đãi</h3><div class="bars">'+ZIDS.map(function(z){var v=r1[z]?r1[z].inv:0;return '<span class="small">'+zc(z)+'</span><span class="bar" style="--zc:'+zvar(z)+'"><i style="width:'+(100*v/mx)+'%"></i></span><span class="mono small">'+fmtNum(v)+'</span>';}).join('')+'</div></div>';}
  h+='</div></div>';
  h+='<div class="panel"><h3>Debrief</h3><div class="tbl"><table><thead><tr><th>Nhóm</th><th>Vùng</th><th>Người nộp</th><th>Vấn đề</th><th>Lý thuyết</th><th>Ngân sách</th><th>KPI</th><th>Rủi ro</th><th class="num">Phần</th><th class="num">Điểm</th><th class="num">Phát triển</th></tr></thead><tbody>';
  Object.keys(ts).forEach(function(t){var s=BOARD.sheets.filter(function(x){return x.rd===1&&x.team===t;})[0],z=ts[t].zone,o=r1&&r1[z];
    h+='<tr><td>'+esc(ts[t].name)+'</td><td>'+zc(z)+'</td>'+(s?'<td class="mono">'+esc(s.u)+'</td><td>'+s.ind.join(', ')+'</td><td>'+esc(s.theory)+'</td><td class="mono small">'+LEVERS.filter(function(k){return s.alloc[k];}).map(function(k){return LEVERCODE[k]+s.alloc[k];}).join(' ')+'</td><td>'+s.kpi+'</td><td>'+s.risk+'</td><td class="num">'+s.parts.join('·')+'</td><td class="num"><b>'+s.score+'</b></td>':'<td colspan="8" class="muted">chưa nộp</td>')+'<td class="num">'+(o?fmtNum(o.before)+'→'+fmtNum(o.after):'—')+'</td></tr>';});
  h+='</tbody></table></div>';
  h+='<details><summary class="small">Đáp án vòng 1 (chỉ giáo viên)</summary><div class="tbl"><table><thead><tr><th>Vùng</th><th>Chỉ báo</th><th>Lý thuyết</th><th>Đòn bẩy</th><th>KPI</th><th>Rủi ro</th><th>Vì sao</th></tr></thead><tbody>'+
   Object.keys(BOARD.keys).map(function(z){var k=BOARD.keys[z];return '<tr><td>'+zc(z)+'</td><td>'+k.ind.join(', ')+'</td><td>'+k.theory.join(', ')+'</td><td>'+k.levers.join(', ')+'</td><td>'+k.kpi.join(', ')+'</td><td>'+k.risk.join(', ')+'</td><td class="small">'+esc(k.why)+'</td></tr>';}).join('')+'</tbody></table></div></details></div>';
  return h;}
function teachAct(a,b){
  if(a==='users'){var lines=$('ul').value.split(/\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){var p=l.split(/\s*[,\t;]\s*/);return {u:p[0],p:p[1]||'',name:p.slice(2).join(' ')};});
    if(!lines.length)return toast('Dán ít nhất một dòng.');tcall('tUsers',{list:lines}).then(function(res){if(res&&res.ok){MADE=res;render();}});}
  else if(a==='madecsv'){if(!MADE)return;csvSave('RegionArena_taikhoan.csv',[['Ten dang nhap','Ma','Ho va ten']].concat(MADE.made.map(function(x){return [x.u,x.p,x.name];})));}
  else if(a==='reset'||a==='del'){var u=b.dataset.u,k=a==='reset'?'armR':'armD';if(b.dataset.step==='1'){teachAct.armR=teachAct.armD=null;teachAct[k]=u;render();return;}teachAct[k]=null;
    tcall(a==='reset'?'tReset':'tUserDel',{u:u},a==='reset'?'Đã xoá tiến độ của '+u+'.':'Đã xoá tài khoản '+u+'.').then(function(){tTeams.rows=null;render();});}
  else if(a==='addteam'){tTeams.rows.push({id:'T'+Date.now().toString(36).slice(-5),name:'Nhóm '+(tTeams.rows.length+1),zone:'V'+((tTeams.rows.length%10)+1),members:''});render();}
  else if(a==='rmteam'){tTeams.rows.splice(+b.dataset.i,1);render();}
  else if(a==='saveteams'){if(tTeams.rows.some(function(r){return !ZONES[r.zone];}))return toast('Chọn vùng V1–V10 cho mọi nhóm trước khi lưu.');var teams={};tTeams.rows.forEach(function(r){teams[r.id]={name:r.name,zone:r.zone,members:r.members};});
    tcall('tTeams',{teams:teams},'Đã lưu các nhóm.').then(function(res){if(res&&res.ok){tTeams.rows=null;render();}});}
  else if(a==='openround'){tcall('tRound',{op:'open'},'Đã mở vòng 1.');}
  else if(a==='runround'){if(b.dataset.step==='1'){teachAct.armRun=true;render();return;}teachAct.armRun=false;tcall('tRound',{op:'run'},'Đã chạy mô phỏng vòng 1.');}
  else if(a==='resetround'){if(b.dataset.step==='1'){teachAct.armRR=true;render();return;}teachAct.armRR=false;tcall('tRound',{op:'reset'},'Đã đặt lại vòng 1.');}}
function scoreRows(){var ts=BOARD.cfg.teams||{},done=BOARD.cfg.round&&BOARD.cfg.round.status==='done';
  return BOARD.users.map(function(x){var p=BOARD.progs[x.u]||null,t=teamOfU(x.u),ss=stationScore(p),rs=null;
    if(t&&done){var s=BOARD.sheets.filter(function(y){return y.rd===1&&y.team===t;})[0];rs=s?s.score/10:0;}
    var clo=[];for(var c=1;c<=6;c++){var v=((p||{}).clo||{})['rg'+c]||[0,0];clo.push(v[0]?pct(v[1],v[0]):null);}
    return {u:x.u,name:x.name,team:t?ts[t].name:'',st:ss,rd:rs,g:gameScore(ss,rs),xp:xpOf(p),clo:clo};});}
function tScore(){var w=weights(),rows=scoreRows();
  var h='<div class="panel"><h3>Trọng số điểm game</h3><div class="row small">'+[['st','Trạm'],['rd','Vòng điều hành']].map(function(x){return '<label>'+x[1]+' <input type="number" min="0" max="100" data-w="'+x[0]+'" value="'+w[x[0]]+'" style="width:5em"></label>';}).join('')+'</div><p class="note">Điểm game = (trạm × '+w.st+' + vòng × '+w.rd+') / tổng trọng số của phần đã diễn ra, thang 10. Trạm = tỷ lệ đúng lần làm đầu trên mọi ga và Trùm của các tuyến đang mở (ga chưa làm tính 0). Kết quả mô phỏng không tính vào điểm.</p></div>';
  return h+'<div class="panel"><div class="row" style="justify-content:space-between"><h3>Bảng điểm</h3><button class="btn ghost sm" data-act="csv">Tải CSV</button></div><div class="tbl"><table><thead><tr><th>Tên đăng nhập</th><th>Họ và tên</th><th>Nhóm</th><th class="num">Trạm</th><th class="num">Vòng</th><th class="num">Game /10</th><th class="num">XP</th>'+[1,2,3,4,5,6].map(function(c){return '<th class="num">CLO'+c+'</th>';}).join('')+'</tr></thead><tbody>'+
   rows.map(function(r){return '<tr><td class="mono">'+esc(r.u)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.team)+'</td><td class="num">'+(r.st==null?'—':pct(r.st,1)+'%')+'</td><td class="num">'+(r.rd==null?'—':fmtNum(r.rd*10))+'</td><td class="num"><b>'+(r.g==null?'—':fmtNum(r.g))+'</b></td><td class="num">'+r.xp+'</td>'+r.clo.map(function(c){return '<td class="num">'+(c==null?'—':c+'%')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div></div>';}
function csvSave(name,rows){var q=function(s){s=String(s==null?'':s);return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  var csv='﻿'+rows.map(function(r){return r.map(q).join(',');}).join('\n'),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);window.__csv=csv;}
function downloadCsv(){var rows=scoreRows();csvSave('RegionArena_diem.csv',[['Ten dang nhap','Ho va ten','Nhom','Tram %','Vong /10','Game /10','XP','CLO1','CLO2','CLO3','CLO4','CLO5','CLO6']].concat(rows.map(function(r){
  return [r.u,r.name,r.team,r.st==null?'':pct(r.st,1),r.rd==null?'':fmtNum(r.rd*10),r.g==null?'':fmtNum(r.g),r.xp].concat(r.clo.map(function(c){return c==null?'':c;}));})));}

boot();
})();
</script>
